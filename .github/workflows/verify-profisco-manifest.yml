name: Test submitted Pro-Fisco manifest
on:
  push:
    branches:
      - codex/pro-fisco-installer-smoke-489591
    paths:
      - .github/workflows/verify-profisco-manifest.yml
permissions: {}
jobs:
  winget-install:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Install 0.4.14 from the submitted WinGet manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          function Find-WinGet {
            $command = Get-Command winget.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            $app = Get-AppxPackage Microsoft.DesktopAppInstaller | Sort-Object Version -Descending | Select-Object -First 1
            if ($app) {
              $binary = Join-Path $app.InstallLocation 'winget.exe'
              if (Test-Path -LiteralPath $binary -PathType Leaf) { return $binary }
            }
          }
          $pfWinGet = Find-WinGet
          if (-not $pfWinGet) { throw 'WinGet could not be located on the clean runner' }
          $pfVersion = (& $pfWinGet --version | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'WinGet did not start' }
          Write-Host "Running WinGet $pfVersion"

          $manifest = Join-Path $env:RUNNER_TEMP 'AlwaysOn.ProFisco-0.4.14'
          New-Item -ItemType Directory -Path $manifest | Out-Null
          $source = 'https://raw.githubusercontent.com/judiaoivan007-max/winget-pkgs/34b891e330bb96955fc0c1b7d4e1ae6f58995eab/manifests/a/AlwaysOn/ProFisco/0.4.14'
          foreach ($name in 'AlwaysOn.ProFisco.yaml','AlwaysOn.ProFisco.installer.yaml','AlwaysOn.ProFisco.locale.pt-MZ.yaml') {
            curl.exe --fail --silent --show-error --max-time 30 "$source/$name" --output (Join-Path $manifest $name)
            if ($LASTEXITCODE -ne 0) { throw "Could not retrieve submitted manifest file $name" }
          }
          & $pfWinGet settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw 'Could not enable manifest testing on the disposable runner' }

          $pfState = Join-Path $env:LOCALAPPDATA 'Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState'
          New-Item -ItemType Directory -Path $pfState -Force | Out-Null
          '{"network":{"downloader":"wininet"}}' | Set-Content -LiteralPath (Join-Path $pfState 'settings.json') -Encoding utf8NoBOM
          Write-Host 'Using WinGet WinINet networking on the disposable runner'

          $registered = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Pro-Fisco Piloto'
          if (Test-Path -LiteralPath $registered) { throw 'Expected an empty install profile' }
          $pfUrl = 'https://downloads.alwayson.dpdns.org/Pro-Fisco-Piloto-Setup-0.4.14-x64.exe'
          $pfProbe = Join-Path $env:RUNNER_TEMP 'pro-fisco-network-probe.exe'
          curl.exe --fail --silent --show-error --connect-timeout 10 --max-time 30 --user-agent 'Windows Package Manager/v1.11.510' $pfUrl --output $pfProbe
          if ($LASTEXITCODE -ne 0) { throw 'The production URL download failed from the Windows VM' }
          if ((Get-FileHash -LiteralPath $pfProbe -Algorithm SHA256).Hash -ne '3D301C17129303FEFE206C75EF5614D8303A6B779418560AD761FD38F7BC66F9') {
            throw 'Production installer digest differed from the submitted manifest'
          }
          Write-Host 'Production URL delivered the expected installer to the Windows VM'

          $log = Join-Path $env:RUNNER_TEMP 'winget-profisco-0.4.14.log'
          $out = Join-Path $env:RUNNER_TEMP 'profisco-cli-stdout.txt'
          $err = Join-Path $env:RUNNER_TEMP 'profisco-cli-stderr.txt'
          $arguments = @('install', '--manifest', ('"{0}"' -f $manifest), '--silent', '--scope', 'user', '--disable-interactivity',
            '--verbose-logs', '--log', ('"{0}"' -f $log))
          $running = Start-Process -FilePath $pfWinGet -ArgumentList $arguments -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $exited = $running.WaitForExit(75000)
          if (-not $exited) { $running.Kill($true); $running.WaitForExit() }
          Get-Content -LiteralPath $out,$err | Where-Object { $_ -match '[a-zA-Z]{3}' } | Select-Object -Last 35
          $diagnostics = Join-Path $pfState 'DiagOutputDir'
          $lastLog = Get-ChildItem -LiteralPath $diagnostics -File -Filter 'WinGet*.log' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($lastLog) { Get-Content -LiteralPath $lastLog.FullName -Tail 38 }
          if (-not $exited) { throw 'WinGet had not returned in 75 seconds' }
          if ($running.ExitCode -ne 0) {
            throw "WinGet manifest install failed with exit code $($running.ExitCode)"
          }
          $app = Get-ItemProperty -LiteralPath $registered
          if ($app.DisplayVersion -ne '0.4.14') { throw "Wrong installed version $($app.DisplayVersion)" }
          if (-not (Test-Path -LiteralPath (Join-Path $app.InstallLocation 'Pro-Fisco.exe') -PathType Leaf)) {
            throw 'Installed launcher missing'
          }
          Write-Host 'Verified successful WinGet manifest installation of Pro-Fisco 0.4.14'
